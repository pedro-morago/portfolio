<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Pedro Morago</title>
  <meta name="robots" content="noindex" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#fbfbf9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0e0f10" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%231a7f4b'/><path d='M29 52l14 14 29-31' fill='none' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <!-- Self-contained on purpose: GitHub Pages serves this file at any depth,
       so it cannot rely on relative paths to styles.css. Links are root-absolute. -->
  <style>
    :root { --bg: #fbfbf9; --ink: #141414; --ink-2: #4f5256; --line: #d3d3cd; --accent: #17693f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e0f10; --ink: #f2f2f0; --ink-2: #b9bbbf; --line: #36393d; --accent: #5fd896; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 520px; }
    .code { color: var(--ink-2); font-weight: 600; letter-spacing: 0.02em; }
    h1 { font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -0.035em; line-height: 1.1; margin: 8px 0 14px; }
    p { color: var(--ink-2); margin-bottom: 28px; font-size: 1.0625rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      display: inline-block;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bg);
      border-radius: 999px;
      padding: 11px 20px;
      text-decoration: none;
      font-weight: 600;
    }
    .btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
    .btn-ghost:hover { border-color: var(--ink); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>This page doesn't exist.</h1>
    <p>The link may be old, or the address may have a typo.</p>
    <div class="actions">
      <a class="btn" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/#work">See the work</a>
    </div>
  </main>
</body>
</html>
