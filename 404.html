<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 · Pedro Morago</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0b0e0c" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230b0e0c'/><text x='14' y='70' font-family='monospace' font-size='46' font-weight='bold' fill='%237bdb9e'>&gt;_</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e0c;
      color: #d3dad4;
      font-family: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 560px; }
    .user { color: #7bdb9e; }
    .err { color: #d9a05b; }
    h1 { color: #eef3ee; font-size: 1.6rem; margin: 14px 0 6px; }

    a {
      display: inline-block;
      color: #7bdb9e;
      border: 1px solid #2e3831;
      border-radius: 6px;
      padding: 9px 18px;
      text-decoration: none;
      font-weight: 700;
      margin-right: 10px;
      margin-bottom: 10px;
    }
    a:hover { background: #45c97a; border-color: #45c97a; color: #08130c; }
  </style>
</head>
<body>
  <main>
    <p><span class="user">pedro@morago</span>:~$ cat page</p>
