<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LinkedIn banner · Pedro Morago</title>
<style>
  /* Misma paleta que styles.css (modo claro): fondo cálido, tinta casi negra
     y el verde de "test pasado" solo como estado. Inter hace de tipografía
     del sistema para que el render sea el mismo en cualquier máquina. */
  @font-face {
    font-family: "Inter";
    font-style: normal;
    font-weight: 100 900;
    src: url("fonts/inter-latin.woff2") format("woff2");
  }

  :root {
    --bg: #fbfbf9;
    --surface: #ffffff;
    --ink: #141414;
    --ink-2: #4f5256;
    --ink-3: #676a6f;
    --line: #e7e7e2;
    --line-strong: #d3d3cd;
    --accent: #17693f;
    --accent-dot: #2fbf71;
    --accent-wash: #eaf5ee;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    width: 1584px;
    height: 396px;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
  }

  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    background: var(--bg);
    overflow: hidden;
  }

  /* Marca: el favicon de la web (cuadrado verde con check), arriba a la
     izquierda, fuera de la zona que tapa la foto de perfil. */
  .mark {
    position: absolute;
    left: 64px; top: 56px;
    width: 56px; height: 56px;
  }

  /* Bloque principal, en el 60 % derecho: zona segura en escritorio y móvil. */
  .content {
    position: absolute;
    left: 570px; right: 64px;
    top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
  }

  h1 {
    font-size: 46px;
    font-weight: 700;
    letter-spacing: -0.035em;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 22px;
  }

  .projects { margin-bottom: 26px; }
  .row {
    display: flex; align-items: baseline;
    font-size: 21px;
    line-height: 1.5;
    color: var(--ink-2);
    white-space: nowrap;
  }
  .row .name {
    width: 250px;
    font-weight: 600;
    color: var(--ink);
  }
  .row .name::before {
    content: "";
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-dot);
    margin-right: 12px;
    vertical-align: 2px;
  }

  .foot {
    display: flex; align-items: center; gap: 18px;
    font-size: 19px;
    color: var(--ink-3);
    white-space: nowrap;
  }
  .foot .url {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--ink);
    color: var(--bg);
    font-weight: 600;
    font-size: 20px;
    padding: 10px 22px;
    border-radius: 999px;
  }
  .foot .url .arrow { font-weight: 500; opacity: 0.85; }
</style>
</head>
<body>
<div class="banner">
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <rect width="100" height="100" rx="24" fill="#1a7f4b"/>
    <path d="M29 52l14 14 29-31" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <div class="content">
    <h1>Projects and a QA wiki</h1>
    <div class="projects">
      <div class="row"><span class="name">CI Shard Advisor</span>Optimal sharding of Cypress suites in CI</div>
      <div class="row"><span class="name">Screen Recorder</span>Chrome extension: bug reports with full evidence</div>
      <div class="row"><span class="name">QA Wiki</span>50+ articles on test strategy, API testing and CI/CD</div>
    </div>
    <div class="foot">
      <span class="url">pedromorago.com<span class="arrow">→</span></span>
      <span>Live demos and code on GitHub</span>
    </div>
  </div>
</div>
</body>
</html>
